<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시책계산기 | FP 헬퍼</title>
<style>
  :root{
    --bg:#f7f8fa;
    --card:#ffffff;
    --border:#e6e8ec;
    --text:#1b1f27;
    --sub:#6b7280;
    --accent:#2454ff;
    --accent-soft:#eaf0ff;
    --head:#3a3f4b;
    --head-soft:#565c6b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:40px 24px 90px;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    text-decoration:none;
    margin-bottom:22px;
  }
  .back:hover{color:var(--accent);}
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .brand .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  h1{
    font-size:28px;
    font-weight:800;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .tagline{
    font-size:14.5px;
    color:var(--sub);
    margin:0 0 24px;
  }
  .section-title{
    font-size:17px;
    font-weight:800;
    margin:40px 0 4px;
  }
  .section-sub{
    font-size:13.5px;
    color:var(--sub);
    margin:0 0 16px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:13.5px;
    font-weight:600;
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.primary:hover{opacity:.92;color:#fff;}
  .table-scroll{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--card);
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:680px;
  }
  th,td{
    border:1px solid var(--border);
    padding:0;
    text-align:center;
    vertical-align:middle;
  }
  .row-head-cell{
    background:var(--head);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:12px 10px;
    white-space:nowrap;
    min-width:110px;
  }
  .company-head-cell{
    background:var(--head-soft);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:12px 10px;
    white-space:nowrap;
  }
  th.col-head{
    background:var(--head);
    padding:6px;
    min-width:110px;
  }
  th.col-range{
    background:#eef0f4;
    padding:6px;
  }
  .cell-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:13.5px;
    padding:10px 8px;
    font-family:inherit;
    color:var(--text);
    outline:none;
  }
  .cell-input.on-dark{color:#fff;}
  .cell-input.on-dark::placeholder{color:rgba(255,255,255,.55);}
  .cell-input::placeholder{color:#a7acb6;}
  .cell-input:focus{background:var(--accent-soft);}
  .cell-input.on-dark:focus{background:rgba(255,255,255,.16);}
  .row-label-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:13px;
    font-weight:700;
    padding:12px 8px;
    font-family:inherit;
    color:#fff;
    outline:none;
  }
  .row-label-input::placeholder{color:rgba(255,255,255,.6);}
  .row-label-input:focus{background:rgba(255,255,255,.16);}
  .company-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:13.5px;
    padding:12px 10px;
    font-family:inherit;
    color:#fff;
    outline:none;
  }
  .company-input::placeholder{color:rgba(255,255,255,.65);}
  .company-input:focus{background:rgba(255,255,255,.16);}
  .col-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  .mini-btn{
    border:none;
    background:transparent;
    color:rgba(255,255,255,.75);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:2px 4px;
  }
  .mini-btn:hover{color:#fff;}
  .mini-btn.light{color:#b6bac2;}
  .mini-btn.light:hover{color:#e0433f;}
  .row-actions-cell{
    background:var(--card);
    padding:6px 8px !important;
    width:36px;
    min-width:36px;
  }
  .row-actions-cell .mini-btn{color:#b6bac2;}
  .row-actions-cell .mini-btn:hover{color:#e0433f;}
  .corner-cell{background:var(--head);}
  .empty-hint{
    font-size:13px;
    color:var(--sub);
    padding:14px 4px 0;
  }
  .sales-table th{
    background:var(--accent-soft);
    color:var(--accent);
    font-size:12.5px;
    font-weight:700;
    padding:10px 8px;
    white-space:nowrap;
  }
  .sales-table td{background:var(--card);}
  .sales-table .cell-input{padding:11px 8px;}
  .sales-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .result-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .result-card .r-title{
    font-weight:700;
    font-size:14.5px;
    margin-bottom:8px;
    color:var(--accent);
  }
  .result-card .r-line{
    font-size:13.5px;
    color:var(--text);
    line-height:1.7;
  }
  .result-card.warn{
    border-color:#f0c48f;
    background:#fff9f0;
  }
  .result-card.warn .r-title{color:#b3660b;}
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    background:#1b1f27;
    color:#fff;
    padding:11px 20px;
    border-radius:999px;
    font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:50;
    max-width:80vw;
    text-align:center;
  }
  .toast.show{opacity:1;}
  footer{
    margin-top:40px;
    font-size:12.5px;
    color:var(--sub);
  }
  @media (max-width:480px){
    .wrap{padding:28px 16px 70px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&larr; 홈으로</a>
    <div class="brand"><span class="dot"></span>fpassistant</div>
    <h1>시책계산기</h1>
    <p class="tagline">실적 구간과 기간별 시책금을 입력해서 관리하고, 매출을 넣으면 달성 구간과 시책금을 자동으로 계산해줍니다.</p>

    <div class="toolbar">
      <button class="btn primary" onclick="addColumn()">+ 구간 추가</button>
      <button class="btn" onclick="addRow()">+ 기간 추가</button>
      <button class="btn" onclick="copyTable()">표 복사하기</button>
      <button class="btn" onclick="saveTable()">표 저장(CSV)</button>
    </div>

    <div class="table-scroll">
      <table id="calc-table"></table>
    </div>
    <p class="empty-hint">구간 칸에 숫자를 입력하면(예: "5만", "5만미만") 아래 "구간 해당 실적"이 자동으로 채워집니다. 시책금 칸에는 "300%"처럼 퍼센트로 입력하거나 "30만"처럼 금액으로 직접 입력할 수 있어요.</p>

    <div class="section-title">매출 입력</div>
    <p class="section-sub">날짜, 매출 금액, 보험사를 입력하면 위 표와 매칭해서 시책금을 계산해드려요. 항목은 자유롭게 추가/삭제할 수 있습니다.</p>

    <div class="table-scroll">
      <table class="sales-table" id="sales-table"></table>
    </div>

    <div class="sales-actions">
      <button class="btn" onclick="addSalesRow()">+ 매출 추가</button>
      <button class="btn primary" onclick="calculate()">계산하기</button>
    </div>

    <div id="results" style="margin-top:20px;"></div>

    <footer>fpassistant · FP 헬퍼</footer>
  </div>

  <div id="toast" class="toast"></div>

<script>
  var state = {
    columns: [{tier:'', range:''}, {tier:'', range:''}, {tier:'', range:''}],
    companies: '',
    rows: [
      {label:'', values:['', '', '']},
      {label:'', values:['', '', '']}
    ]
  };

  var salesState = [
    {date:'', amount:'', company:''}
  ];

  /* ---------- number / text helpers ---------- */

  function esc(s){
    return (s || '').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toNumber(str){
    if(str == null) return NaN;
    var s = String(str).trim();
    if(s === '') return NaN;
    s = s.replace(/,/g,'').replace(/원/g,'').trim();
    var eokMatch = s.match(/([\d.]+)\s*억/);
    var manMatch = s.match(/([\d.]+)\s*만/);
    if(eokMatch || manMatch){
      var val = 0;
      if(eokMatch){ val += parseFloat(eokMatch[1]) * 100000000; }
      if(manMatch){ val += parseFloat(manMatch[1]) * 10000; }
      return Math.round(val);
    }
    var plain = s.match(/[\d.]+/);
    if(plain) return Math.round(parseFloat(plain[0]));
    return NaN;
  }

  function fmtNum(n){
    if(n == null || isNaN(n)) return '';
    return Math.round(n).toLocaleString('ko-KR');
  }

  function parseRange(text){
    if(!text) return null;
    var t = String(text).trim();
    if(t === '') return null;
    var hasUnder = /미만/.test(t);
    var leadingOpen = /^[~\-]/.test(t);
    var cleaned = t.replace(/미만|이상|초과|↑/g, '');
    var rawParts = cleaned.split(/~|-/);
    if(leadingOpen){
      var upperStr = rawParts.length > 1 ? rawParts[1] : rawParts[0];
      var upper = toNumber(upperStr);
      if(!isNaN(upper)) return {min: 0, max: upper};
    }
    var parts = rawParts.map(function(p){ return p.trim(); }).filter(function(p){ return p !== ''; });
    var nums = parts.map(toNumber).filter(function(n){ return !isNaN(n); });
    if(nums.length >= 2) return {min: nums[0], max: nums[1]};
    if(nums.length === 1){
      if(hasUnder) return {min: 0, max: nums[0] - 1};
      return {min: nums[0], max: Infinity};
    }
    return null;
  }

  function parseDay(str){
    var m = String(str || '').match(/\d+/);
    return m ? parseInt(m[0], 10) : NaN;
  }

  function parseRowDayRange(label){
    var nums = String(label || '').match(/\d+/g);
    if(!nums) return null;
    if(nums.length >= 2) return {min: parseInt(nums[0], 10), max: parseInt(nums[1], 10)};
    var n = parseInt(nums[0], 10);
    return {min: n, max: n};
  }

  /* ---------- main tier table ---------- */

  function updateColTier(i, val){
    state.columns[i].tier = val;
    autoFillRanges();
    syncRangeInputsDOM();
  }
  function updateColRange(i, val){ state.columns[i].range = val; }
  function updateCompanies(val){ state.companies = val; }
  function updateRowLabel(i, val){ state.rows[i].label = val; }
  function updateCellValue(r, c, val){ state.rows[r].values[c] = val; }

  function autoFillRanges(){
    var vals = state.columns.map(function(col){
      var t = col.tier || '';
      if(!/\d/.test(t)) return null;
      var n = toNumber(t);
      return isNaN(n) ? null : n;
    });
    state.columns.forEach(function(col, i){
      if(vals[i] == null) return;
      if(/미만/.test(col.tier)){
        col.range = '~' + fmtNum(vals[i] - 1);
        return;
      }
      var nextVal = null;
      for(var j = i + 1; j < vals.length; j++){
        if(vals[j] != null){ nextVal = vals[j]; break; }
      }
      if(nextVal != null){
        col.range = fmtNum(vals[i]) + '~' + fmtNum(nextVal - 1);
      } else {
        col.range = fmtNum(vals[i]) + ' 이상';
      }
    });
  }

  function syncRangeInputsDOM(){
    state.columns.forEach(function(col, i){
      var el = document.getElementById('range-input-' + i);
      if(el && el.value !== col.range){ el.value = col.range; }
    });
  }

  function addColumn(){
    state.columns.push({tier:'', range:''});
    state.rows.forEach(function(r){ r.values.push(''); });
    renderTable();
  }
  function removeColumn(i){
    if(state.columns.length <= 1) return;
    state.columns.splice(i, 1);
    state.rows.forEach(function(r){ r.values.splice(i, 1); });
    renderTable();
  }
  function addRow(){
    state.rows.push({label:'', values: state.columns.map(function(){ return ''; })});
    renderTable();
  }
  function removeRow(i){
    if(state.rows.length <= 1) return;
    state.rows.splice(i, 1);
    renderTable();
  }

  function renderTable(){
    var t = document.getElementById('calc-table');
    var html = '';

    html += '<tr>';
    html += '<td class="row-head-cell">구간</td>';
    state.columns.forEach(function(col, i){
      html += '<th class="col-head">';
      html += '<div class="col-actions">';
      html += '<input class="cell-input on-dark" placeholder="구간명" value="'+esc(col.tier)+'" oninput="updateColTier('+i+',this.value)">';
      html += '<button class="mini-btn" title="이 구간 삭제" onclick="removeColumn('+i+')">&times;</button>';
      html += '</div></th>';
    });
    html += '<td class="corner-cell"></td>';
    html += '</tr>';

    html += '<tr>';
    html += '<td class="row-head-cell">구간 해당 실적</td>';
    state.columns.forEach(function(col, i){
      html += '<th class="col-range"><input id="range-input-'+i+'" class="cell-input" placeholder="실적 범위" value="'+esc(col.range)+'" oninput="updateColRange('+i+',this.value)"></th>';
    });
    html += '<td class="corner-cell"></td>';
    html += '</tr>';

    html += '<tr>';
    html += '<td class="row-head-cell">참여사</td>';
    html += '<td class="company-head-cell" colspan="'+(state.columns.length+1)+'">';
    html += '<input class="company-input" placeholder="예: 메리츠 / 삼성 / DB / 한화 / KB / 현대 / 롯데 / 하나 / 흥국 / 라이나 / 농협" value="'+esc(state.companies)+'" oninput="updateCompanies(this.value)">';
    html += '</td>';
    html += '</tr>';

    state.rows.forEach(function(row, r){
      html += '<tr>';
      html += '<td class="row-head-cell">';
      html += '<div class="col-actions">';
      html += '<input class="row-label-input" placeholder="예: 1~15일(토)" value="'+esc(row.label)+'" oninput="updateRowLabel('+r+',this.value)">';
      html += '</div></td>';
      row.values.forEach(function(v, c){
        html += '<td><input class="cell-input" placeholder="시책금" value="'+esc(v)+'" oninput="updateCellValue('+r+','+c+',this.value)"></td>';
      });
      html += '<td class="row-actions-cell"><button class="mini-btn light" title="이 기간 삭제" onclick="removeRow('+r+')">&times;</button></td>';
      html += '</tr>';
    });

    t.innerHTML = html;
  }

  /* ---------- sales input table ---------- */

  function updateSalesField(i, field, val){ salesState[i][field] = val; }

  function addSalesRow(){
    salesState.push({date:'', amount:'', company:''});
    renderSales();
  }
  function removeSalesRow(i){
    if(salesState.length <= 1) return;
    salesState.splice(i, 1);
    renderSales();
  }

  function renderSales(){
    var t = document.getElementById('sales-table');
    var html = '';
    html += '<tr><th style="width:22%">날짜</th><th style="width:28%">매출 금액</th><th style="width:28%">보험사</th><th style="width:60px"></th></tr>';
    salesState.forEach(function(s, i){
      html += '<tr>';
      html += '<td><input class="cell-input" placeholder="예: 6일" value="'+esc(s.date)+'" oninput="updateSalesField('+i+',\'date\',this.value)"></td>';
      html += '<td><input class="cell-input" placeholder="예: 51,251원" value="'+esc(s.amount)+'" oninput="updateSalesField('+i+',\'amount\',this.value)"></td>';
      html += '<td><input class="cell-input" placeholder="예: 메리츠" value="'+esc(s.company)+'" oninput="updateSalesField('+i+',\'company\',this.value)"></td>';
      html += '<td class="row-actions-cell"><button class="mini-btn light" title="삭제" onclick="removeSalesRow('+i+')">&times;</button></td>';
      html += '</tr>';
    });
    t.innerHTML = html;
  }

  /* ---------- calculation ---------- */

  function matchRowForDay(day){
    for(var i = 0; i < state.rows.length; i++){
      var r = parseRowDayRange(state.rows[i].label);
      if(r && day >= r.min && day <= r.max) return i;
    }
    return -1;
  }

  function matchColumnForAmount(amount, ranges){
    for(var i = 0; i < ranges.length; i++){
      var r = ranges[i];
      if(r && amount >= r.min && amount <= r.max) return i;
    }
    return -1;
  }

  function findNextTier(amount, ranges){
    var best = null;
    ranges.forEach(function(r, i){
      if(r && r.min > amount){
        if(best === null || r.min < best.base){ best = {index:i, base:r.min}; }
      }
    });
    return best;
  }

  function computeCellResult(cellText, tierBase){
    if(!cellText) return null;
    var pct = cellText.match(/([\d.]+)\s*%/);
    if(pct){
      if(isNaN(tierBase)) return null;
      return Math.round(tierBase * (parseFloat(pct[1]) / 100));
    }
    var v = toNumber(cellText);
    return isNaN(v) ? null : v;
  }

  function calculate(){
    var ranges = state.columns.map(function(col){
      var r = parseRange(col.range);
      if(!r) r = parseRange(col.tier);
      return r;
    });

    var groups = {};
    var unmatched = [];

    salesState.forEach(function(s){
      var dateStr = (s.date || '').trim();
      var amtStr = (s.amount || '').trim();
      var company = (s.company || '').trim() || '미지정';
      if(!dateStr && !amtStr) return;

      var day = parseDay(dateStr);
      var amount = toNumber(amtStr);
      if(isNaN(day) || isNaN(amount)){
        unmatched.push({company:company, date:dateStr, amount:amtStr, reason:'날짜 또는 금액을 확인해주세요'});
        return;
      }
      var rowIdx = matchRowForDay(day);
      if(rowIdx === -1){
        unmatched.push({company:company, date:dateStr, amount:amtStr, reason:'일치하는 기간(행)을 찾을 수 없습니다'});
        return;
      }
      var key = company + '__' + rowIdx;
      if(!groups[key]) groups[key] = {company:company, rowIndex:rowIdx, rowLabel: state.rows[rowIdx].label || ('기간 ' + (rowIdx+1)), total:0};
      groups[key].total += amount;
    });

    var cards = [];

    Object.keys(groups).forEach(function(key){
      var g = groups[key];
      var colIdx = matchColumnForAmount(g.total, ranges);
      if(colIdx === -1){
        cards.push({warn:true, title:g.company + ' · ' + g.rowLabel, lines:['매출 합계 ' + fmtNum(g.total) + '원에 해당하는 구간을 찾을 수 없습니다. 구간표를 확인해주세요.']});
        return;
      }
      var cellText = (state.rows[g.rowIndex].values[colIdx] || '').trim();
      var tierBase = ranges[colIdx] ? ranges[colIdx].min : toNumber(state.columns[colIdx].tier);
      var result = computeCellResult(cellText, tierBase);
      var tierLabel = state.columns[colIdx].tier || ('구간 ' + (colIdx+1));

      var lines = [];
      lines.push('매출 합계 ' + fmtNum(g.total) + '원 → ' + tierLabel + ' 구간');
      if(result != null){
        lines.push(fmtNum(result) + '원 달성!');
      } else {
        lines.push('해당 구간의 시책금이 입력되지 않았습니다.');
      }

      var next = findNextTier(g.total, ranges);
      if(next){
        var gap = next.base - g.total;
        var nextLabel = state.columns[next.index].tier || ('구간 ' + (next.index+1));
        lines.push(nextLabel + ' 구간 달성을 위한 추가 목표 매출금액은 ' + fmtNum(gap) + '원 입니다.');
      } else {
        lines.push('최고 구간을 달성했습니다!');
      }

      cards.push({warn:false, title:g.company + ' · ' + g.rowLabel, lines:lines});
    });

    unmatched.forEach(function(u){
      cards.push({warn:true, title:u.company + ' 입력 확인 필요', lines:[u.reason + ' (날짜: "' + u.date + '", 금액: "' + u.amount + '")']});
    });

    renderResults(cards);
  }

  function renderResults(cards){
    var el = document.getElementById('results');
    if(!cards.length){
      el.innerHTML = '<p class="section-sub">매출을 입력하고 계산하기를 눌러주세요.</p>';
      return;
    }
    var html = '';
    cards.forEach(function(c){
      html += '<div class="result-card' + (c.warn ? ' warn' : '') + '">';
      html += '<div class="r-title">' + esc(c.title) + '</div>';
      c.lines.forEach(function(line){
        html += '<div class="r-line">' + esc(line) + '</div>';
      });
      html += '</div>';
    });
    el.innerHTML = html;
  }

  /* ---------- copy / save ---------- */

  function buildTableMatrix(){
    var matrix = [];
    matrix.push(['구간'].concat(state.columns.map(function(c){ return c.tier; })));
    matrix.push(['구간 해당 실적'].concat(state.columns.map(function(c){ return c.range; })));
    var companyRow = ['참여사', state.companies];
    for(var i = 1; i < state.columns.length; i++){ companyRow.push(''); }
    matrix.push(companyRow);
    state.rows.forEach(function(row){
      matrix.push([row.label].concat(row.values));
    });
    return matrix;
  }

  function tableToTSV(matrix){
    return matrix.map(function(r){
      return r.map(function(c){ return (c || '').toString().replace(/\t/g,' ').replace(/\n/g,' '); }).join('\t');
    }).join('\n');
  }

  function tableToCSV(matrix){
    return matrix.map(function(r){
      return r.map(function(c){
        var v = (c == null ? '' : String(c));
        if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
        return v;
      }).join(',');
    }).join('\r\n');
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function copyTable(){
    var tsv = tableToTSV(buildTableMatrix());
    function done(){ showToast('표가 복사되었습니다. 엑셀이나 메신저에 붙여넣기 하세요.'); }
    function fallback(){
      try{
        var ta = document.createElement('textarea');
        ta.value = tsv;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }catch(e){
        showToast('복사에 실패했습니다. 표를 직접 선택해서 복사해주세요.');
      }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(tsv).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  function saveTable(){
    var csv = '﻿' + tableToCSV(buildTableMatrix());
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    var stamp = d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
    a.href = url;
    a.download = '시책계산기_' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('CSV 파일로 저장되었습니다.');
  }

  renderTable();
  renderSales();
  renderResults([]);
</script>
</body>
</html>
