<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시책계산기 | FP 헬퍼</title>
<style>
  :root{
    --bg:#f7f8fa;
    --card:#ffffff;
    --border:#e6e8ec;
    --text:#1b1f27;
    --sub:#6b7280;
    --accent:#2454ff;
    --accent-soft:#eaf0ff;
    --head:#3a3f4b;
    --head-soft:#565c6b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    text-decoration:none;
    margin-bottom:22px;
  }
  .back:hover{color:var(--accent);}
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .brand .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  h1{
    font-size:28px;
    font-weight:800;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .tagline{
    font-size:14.5px;
    color:var(--sub);
    margin:0 0 28px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:13.5px;
    font-weight:600;
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.primary:hover{opacity:.92;color:#fff;}
  .table-scroll{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--card);
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:680px;
  }
  th,td{
    border:1px solid var(--border);
    padding:0;
    text-align:center;
    vertical-align:middle;
  }
  .row-head-cell{
    background:var(--head);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:12px 10px;
    white-space:nowrap;
    min-width:110px;
  }
  .company-head-cell{
    background:var(--head-soft);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:12px 10px;
    white-space:nowrap;
  }
  th.col-head{
    background:var(--head);
    padding:6px;
    min-width:110px;
  }
  th.col-range{
    background:#eef0f4;
    padding:6px;
  }
  .cell-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:13.5px;
    padding:10px 8px;
    font-family:inherit;
    color:var(--text);
    outline:none;
  }
  .cell-input.on-dark{
    color:#fff;
  }
  .cell-input.on-dark::placeholder{color:rgba(255,255,255,.55);}
  .cell-input::placeholder{color:#a7acb6;}
  .cell-input:focus{
    background:var(--accent-soft);
  }
  .cell-input.on-dark:focus{
    background:rgba(255,255,255,.16);
  }
  .row-label-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:13px;
    font-weight:700;
    padding:12px 8px;
    font-family:inherit;
    color:#fff;
    outline:none;
  }
  .row-label-input::placeholder{color:rgba(255,255,255,.6);}
  .row-label-input:focus{background:rgba(255,255,255,.16);}
  .company-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:13.5px;
    padding:12px 10px;
    font-family:inherit;
    color:#fff;
    outline:none;
  }
  .company-input::placeholder{color:rgba(255,255,255,.65);}
  .company-input:focus{background:rgba(255,255,255,.16);}
  .col-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  .mini-btn{
    border:none;
    background:transparent;
    color:rgba(255,255,255,.75);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:2px 4px;
  }
  .mini-btn:hover{color:#fff;}
  .row-actions-cell{
    background:var(--card);
    padding:6px 8px !important;
    width:36px;
    min-width:36px;
  }
  .row-actions-cell .mini-btn{
    color:#b6bac2;
  }
  .row-actions-cell .mini-btn:hover{color:#e0433f;}
  .corner-cell{
    background:var(--head);
  }
  .empty-hint{
    font-size:13px;
    color:var(--sub);
    padding:14px 4px 0;
  }
  footer{
    margin-top:36px;
    font-size:12.5px;
    color:var(--sub);
  }
  @media (max-width:480px){
    .wrap{padding:28px 16px 60px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&larr; 홈으로</a>
    <div class="brand"><span class="dot"></span>fpassistant</div>
    <h1>시책계산기</h1>
    <p class="tagline">실적 구간과 기간별 시책금을 직접 입력해서 관리하세요. 구간(열)과 기간(행)은 자유롭게 추가/삭제할 수 있습니다.</p>

    <div class="toolbar">
      <button class="btn primary" onclick="addColumn()">+ 구간 추가</button>
      <button class="btn" onclick="addRow()">+ 기간 추가</button>
    </div>

    <div class="table-scroll">
      <table id="calc-table"></table>
    </div>
    <p class="empty-hint">칸을 클릭해서 값을 입력하세요. 예: 구간 "5만↑", 실적 "50,000 ~ 99,999", 참여사 "메리츠/삼성/DB", 시책금 "30만"</p>

    <footer>fpassistant · FP 헬퍼</footer>
  </div>

<script>
  var state = {
    columns: [{tier:'', range:''}, {tier:'', range:''}, {tier:'', range:''}],
    companies: '',
    rows: [
      {label:'', values:['', '', '']},
      {label:'', values:['', '', '']}
    ]
  };

  function updateColTier(i, val){ state.columns[i].tier = val; }
  function updateColRange(i, val){ state.columns[i].range = val; }
  function updateCompanies(val){ state.companies = val; }
  function updateRowLabel(i, val){ state.rows[i].label = val; }
  function updateCellValue(r, c, val){ state.rows[r].values[c] = val; }

  function addColumn(){
    state.columns.push({tier:'', range:''});
    state.rows.forEach(function(r){ r.values.push(''); });
    render();
  }
  function removeColumn(i){
    if(state.columns.length <= 1) return;
    state.columns.splice(i, 1);
    state.rows.forEach(function(r){ r.values.splice(i, 1); });
    render();
  }
  function addRow(){
    state.rows.push({label:'', values: state.columns.map(function(){ return ''; })});
    render();
  }
  function removeRow(i){
    if(state.rows.length <= 1) return;
    state.rows.splice(i, 1);
    render();
  }

  function esc(s){
    return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render(){
    var t = document.getElementById('calc-table');
    var html = '';

    html += '<tr>';
    html += '<td class="corner-cell"></td>';
    state.columns.forEach(function(col, i){
      html += '<th class="col-head">';
      html += '<div class="col-actions">';
      html += '<input class="cell-input on-dark" placeholder="구간명" value="'+esc(col.tier)+'" oninput="updateColTier('+i+',this.value)">';
      html += '<button class="mini-btn" title="이 구간 삭제" onclick="removeColumn('+i+')">&times;</button>';
      html += '</div></th>';
    });
    html += '<td class="corner-cell"></td>';
    html += '</tr>';

    html += '<tr>';
    html += '<td class="row-head-cell">구간 해당 실적</td>';
    state.columns.forEach(function(col, i){
      html += '<th class="col-range"><input class="cell-input" placeholder="실적 범위" value="'+esc(col.range)+'" oninput="updateColRange('+i+',this.value)"></th>';
    });
    html += '<td class="corner-cell"></td>';
    html += '</tr>';

    html += '<tr>';
    html += '<td class="row-head-cell">참여사</td>';
    html += '<td class="company-head-cell" colspan="'+(state.columns.length+1)+'">';
    html += '<input class="company-input" placeholder="예: 메리츠 / 삼성 / DB / 한화 / KB / 현대 / 롯데 / 하나 / 흥국 / 라이나 / 농협" value="'+esc(state.companies)+'" oninput="updateCompanies(this.value)">';
    html += '</td>';
    html += '</tr>';

    state.rows.forEach(function(row, r){
      html += '<tr>';
      html += '<td class="row-head-cell">';
      html += '<div class="col-actions">';
      html += '<input class="row-label-input" placeholder="예: 1~15일(토)" value="'+esc(row.label)+'" oninput="updateRowLabel('+r+',this.value)">';
      html += '</div></td>';
      row.values.forEach(function(v, c){
        html += '<td><input class="cell-input" placeholder="시책금" value="'+esc(v)+'" oninput="updateCellValue('+r+','+c+',this.value)"></td>';
      });
      html += '<td class="row-actions-cell"><button class="mini-btn" title="이 기간 삭제" onclick="removeRow('+r+')">&times;</button></td>';
      html += '</tr>';
    });

    t.innerHTML = html;
  }

  render();
</script>
</body>
</html>
